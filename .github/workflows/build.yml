name: Build Lava Generator mod
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Generate project files
        run: |
          cat > build.gradle <<'__EOF__'
          plugins {
              id 'java-library'
              id 'net.neoforged.moddev' version '2.0.147'
          }

          version = mod_version
          group = mod_group_id

          base {
              archivesName = mod_id
          }

          java.toolchain.languageVersion = JavaLanguageVersion.of(25)

          neoForge {
              version = project.neo_version

              mods {
                  "${mod_id}" {
                      sourceSet(sourceSets.main)
                  }
              }
          }

          var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
              var replaceProperties = [
                      minecraft_version      : minecraft_version,
                      minecraft_version_range: minecraft_version_range,
                      neo_version            : neo_version,
                      mod_id                 : mod_id,
                      mod_name               : mod_name,
                      mod_license            : mod_license,
                      mod_version            : mod_version,
              ]
              inputs.properties replaceProperties
              expand replaceProperties
              from "src/main/templates"
              into "build/generated/sources/modMetadata"
          }
          sourceSets.main.resources.srcDir generateModMetadata
          neoForge.ideSyncTask generateModMetadata

          tasks.withType(JavaCompile).configureEach {
              options.encoding = 'UTF-8'
          }
          __EOF__
          cat > gradle.properties <<'__EOF__'
          org.gradle.jvmargs=-Xmx3G
          org.gradle.daemon=false
          org.gradle.parallel=true
          org.gradle.caching=true
          org.gradle.configuration-cache=true

          minecraft_version=26.2
          minecraft_version_range=[26.2]
          neo_version=26.2.0.88

          mod_id=lavagenerator
          mod_name=Lava Generator
          mod_license=All Rights Reserved
          mod_version=1.0.0
          mod_group_id=com.badtothebonejjc.lavagenerator
          __EOF__
          cat > settings.gradle <<'__EOF__'
          pluginManagement {
              repositories {
                  mavenLocal()
                  gradlePluginPortal()
                  maven {
                      name = 'NeoForged'
                      url = 'https://maven.neoforged.net/releases'
                  }
              }
          }

          plugins {
              id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
          }
          __EOF__
          mkdir -p src/main/java/com/badtothebonejjc/lavagenerator
          cat > src/main/java/com/badtothebonejjc/lavagenerator/LavaGenerator.java <<'__EOF__'
          package com.badtothebonejjc.lavagenerator;

          import java.util.function.Supplier;

          import net.minecraft.core.registries.Registries;
          import net.minecraft.world.flag.FeatureFlags;
          import net.minecraft.world.inventory.MenuType;
          import net.minecraft.world.item.BlockItem;
          import net.minecraft.world.item.CreativeModeTabs;
          import net.minecraft.world.level.block.entity.BlockEntityType;
          import net.minecraft.world.level.block.state.BlockBehaviour;
          import net.minecraft.world.level.material.MapColor;
          import net.neoforged.bus.api.IEventBus;
          import net.neoforged.fml.common.Mod;
          import net.neoforged.neoforge.capabilities.Capabilities;
          import net.neoforged.neoforge.capabilities.RegisterCapabilitiesEvent;
          import net.neoforged.neoforge.event.BuildCreativeModeTabContentsEvent;
          import net.neoforged.neoforge.registries.DeferredBlock;
          import net.neoforged.neoforge.registries.DeferredItem;
          import net.neoforged.neoforge.registries.DeferredRegister;

          @Mod(LavaGenerator.MODID)
          public class LavaGenerator {
              public static final String MODID = "lavagenerator";

              public static final DeferredRegister.Blocks BLOCKS = DeferredRegister.createBlocks(MODID);
              public static final DeferredRegister.Items ITEMS = DeferredRegister.createItems(MODID);
              public static final DeferredRegister<BlockEntityType<?>> BLOCK_ENTITIES = DeferredRegister.create(Registries.BLOCK_ENTITY_TYPE, MODID);
              public static final DeferredRegister<MenuType<?>> MENUS = DeferredRegister.create(Registries.MENU, MODID);

              public static final DeferredBlock<LavaGeneratorBlock> LAVA_GENERATOR = BLOCKS.registerBlock(
                      "lava_generator",
                      LavaGeneratorBlock::new,
                      BlockBehaviour.Properties.of()
                              .mapColor(MapColor.STONE)
                              .strength(3.5F)
                              .requiresCorrectToolForDrops()
                              .lightLevel(state -> 7));

              public static final DeferredItem<BlockItem> LAVA_GENERATOR_ITEM = ITEMS.registerSimpleBlockItem(LAVA_GENERATOR);

              public static final Supplier<BlockEntityType<LavaGeneratorBlockEntity>> LAVA_GENERATOR_BE = BLOCK_ENTITIES.register(
                      "lava_generator",
                      () -> new BlockEntityType<>(LavaGeneratorBlockEntity::new, LAVA_GENERATOR.get()));

              public static final Supplier<MenuType<LavaGeneratorMenu>> LAVA_GENERATOR_MENU = MENUS.register(
                      "lava_generator",
                      () -> new MenuType<>(LavaGeneratorMenu::new, FeatureFlags.DEFAULT_FLAGS));

              public LavaGenerator(IEventBus modEventBus) {
                  BLOCKS.register(modEventBus);
                  ITEMS.register(modEventBus);
                  BLOCK_ENTITIES.register(modEventBus);
                  MENUS.register(modEventBus);
                  modEventBus.addListener(this::registerCapabilities);
                  modEventBus.addListener(this::addCreative);
              }

              private void registerCapabilities(RegisterCapabilitiesEvent event) {
                  // Energy: cables and machines can pull FE out of the generator
                  event.registerBlockEntity(Capabilities.Energy.BLOCK, LAVA_GENERATOR_BE.get(),
                          (be, side) -> be.getEnergy());
                  // Fluid: pipes and tanks can push lava in
                  event.registerBlockEntity(Capabilities.Fluid.BLOCK, LAVA_GENERATOR_BE.get(),
                          (be, side) -> be.getTank());
              }

              private void addCreative(BuildCreativeModeTabContentsEvent event) {
                  if (event.getTabKey() == CreativeModeTabs.FUNCTIONAL_BLOCKS) {
                      event.accept(LAVA_GENERATOR_ITEM.get());
                  }
              }
          }
          __EOF__
