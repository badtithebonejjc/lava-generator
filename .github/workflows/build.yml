          cat > src/main/java/com/badtothebonejjc/lavagenerator/LavaGeneratorBlock.java <<'__EOF__'
          package com.badtothebonejjc.lavagenerator;

          import com.mojang.serialization.MapCodec;

          import net.minecraft.core.BlockPos;
          import net.minecraft.server.level.ServerPlayer;
          import net.minecraft.sounds.SoundEvents;
          import net.minecraft.sounds.SoundSource;
          import net.minecraft.world.InteractionHand;
          import net.minecraft.world.InteractionResult;
          import net.minecraft.world.entity.player.Player;
          import net.minecraft.world.item.ItemStack;
          import net.minecraft.world.item.ItemUtils;
          import net.minecraft.world.item.Items;
          import net.minecraft.world.level.Level;
          import net.minecraft.world.level.block.Block;
          import net.minecraft.world.level.block.EntityBlock;
          import net.minecraft.world.level.block.entity.BlockEntity;
          import net.minecraft.world.level.block.entity.BlockEntityTicker;
          import net.minecraft.world.level.block.entity.BlockEntityType;
          import net.minecraft.world.level.block.state.BlockBehaviour;
          import net.minecraft.world.level.block.state.BlockState;
          import net.minecraft.world.phys.BlockHitResult;

          public class LavaGeneratorBlock extends Block implements EntityBlock {
              public static final MapCodec<LavaGeneratorBlock> CODEC = simpleCodec(LavaGeneratorBlock::new);

              public LavaGeneratorBlock(BlockBehaviour.Properties properties) {
                  super(properties);
              }

              @Override
              protected MapCodec<? extends Block> codec() {
                  return CODEC;
              }

              @Override
              public BlockEntity newBlockEntity(BlockPos pos, BlockState state) {
                  return new LavaGeneratorBlockEntity(pos, state);
              }

              @Override
              public <T extends BlockEntity> BlockEntityTicker<T> getTicker(Level level, BlockState state, BlockEntityType<T> type) {
                  if (level.isClientSide()) {
                      return null;
                  }
                  if (type == LavaGenerator.LAVA_GENERATOR_BE.get()) {
                      return (lvl, pos, st, be) -> ((LavaGeneratorBlockEntity) be).serverTick(lvl, pos, st);
                  }
                  return null;
              }

              // Right-click with a lava bucket (fill) or an empty bucket (take lava back)
              @Override
              protected InteractionResult useItemOn(ItemStack stack, BlockState state, Level level, BlockPos pos,
                                                    Player player, InteractionHand hand, BlockHitResult hit) {
                  boolean lavaBucket = stack.is(Items.LAVA_BUCKET);
                  boolean emptyBucket = stack.is(Items.BUCKET);
                  if (!lavaBucket && !emptyBucket) {
                      return InteractionResult.TRY_WITH_EMPTY_HAND;
                  }
                  if (!level.isClientSide() && level.getBlockEntity(pos) instanceof LavaGeneratorBlockEntity be) {
                      if (lavaBucket && be.addLavaBucket()) {
                          if (!player.hasInfiniteMaterials()) {
                              player.setItemInHand(hand, ItemUtils.createFilledResult(stack, player, new ItemStack(Items.BUCKET)));
                          }
                          level.playSound(null, pos, SoundEvents.BUCKET_EMPTY_LAVA, SoundSource.BLOCKS, 1.0F, 1.0F);
                      } else if (emptyBucket && be.takeLavaBucket()) {
                          if (!player.hasInfiniteMaterials()) {
                              player.setItemInHand(hand, ItemUtils.createFilledResult(stack, player, new ItemStack(Items.LAVA_BUCKET)));
                          }
                          level.playSound(null, pos, SoundEvents.BUCKET_FILL_LAVA, SoundSource.BLOCKS, 1.0F, 1.0F);
                      }
                  }
                  return InteractionResult.SUCCESS;
              }

              // Right-click with anything else: open the GUI
              @Override
              protected InteractionResult useWithoutItem(BlockState state, Level level, BlockPos pos, Player player, BlockHitResult hit) {
                  if (!level.isClientSide() && player instanceof ServerPlayer serverPlayer
                          && level.getBlockEntity(pos) instanceof LavaGeneratorBlockEntity be) {
                      serverPlayer.openMenu(be);
                  }
                  return InteractionResult.SUCCESS;
              }
          }
          __EOF__
