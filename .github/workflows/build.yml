          package com.badtothebonejjc.lavagenerator;

          import net.minecraft.world.entity.player.Inventory;
          import net.minecraft.world.entity.player.Player;
          import net.minecraft.world.inventory.AbstractContainerMenu;
          import net.minecraft.world.inventory.ContainerData;
          import net.minecraft.world.inventory.ContainerLevelAccess;
          import net.minecraft.world.inventory.SimpleContainerData;
          import net.minecraft.world.item.ItemStack;

          public class LavaGeneratorMenu extends AbstractContainerMenu {
              private final ContainerData data;
              private final ContainerLevelAccess access;

              // Client constructor
              public LavaGeneratorMenu(int containerId, Inventory playerInventory) {
                  this(containerId, playerInventory, new SimpleContainerData(2), ContainerLevelAccess.NULL);
              }

              // Server constructor
              public LavaGeneratorMenu(int containerId, Inventory playerInventory, ContainerData data, ContainerLevelAccess access) {
                  super(LavaGenerator.LAVA_GENERATOR_MENU.get(), containerId);
                  checkContainerDataCount(data, 2);
                  this.data = data;
                  this.access = access;
                  this.addStandardInventorySlots(playerInventory, 8, 84);
                  this.addDataSlots(data);
              }

              public int getLava() {
                  return data.get(0);
              }

              public int getEnergy() {
                  return data.get(1);
              }

              @Override
              public ItemStack quickMoveStack(Player player, int index) {
                  return ItemStack.EMPTY;
              }

              @Override
              public boolean stillValid(Player player) {
                  return stillValid(access, player, LavaGenerator.LAVA_GENERATOR.get());
              }
          }
