          package com.badtothebonejjc.lavagenerator;

          import net.minecraft.client.gui.GuiGraphicsExtractor;
          import net.minecraft.client.gui.screens.inventory.AbstractContainerScreen;
          import net.minecraft.network.chat.Component;
          import net.minecraft.world.entity.player.Inventory;

          public class LavaGeneratorScreen extends AbstractContainerScreen<LavaGeneratorMenu> {
              private static final int BAR_TOP = 18;
              private static final int BAR_HEIGHT = 48;
              private static final int LAVA_X = 44;
              private static final int ENERGY_X = 114;
              private static final int BAR_WIDTH = 18;

              public LavaGeneratorScreen(LavaGeneratorMenu menu, Inventory playerInventory, Component title) {
                  super(menu, playerInventory, title, 176, 166);
                  this.inventoryLabelY = 1000; // hide the "Inventory" label so it doesn't overlap
              }

              @Override
              public void extractRenderState(GuiGraphicsExtractor g, int mouseX, int mouseY, float partialTick) {
                  int x = this.leftPos;
                  int y = this.topPos;

                  // Panel
                  g.fill(x, y, x + 176, y + 166, 0xFF000000);
                  g.fill(x + 1, y + 1, x + 175, y + 165, 0xFFC6C6C6);

                  // Player inventory slot backgrounds
                  for (int row = 0; row < 3; row++) {
                      for (int col = 0; col < 9; col++) {
                          slotBg(g, x + 7 + col * 18, y + 83 + row * 18);
                      }
                  }
                  for (int col = 0; col < 9; col++) {
                      slotBg(g, x + 7 + col * 18, y + 141);
                  }

                  // Lava bar
                  int lava = this.menu.getLava();
                  bar(g, x + LAVA_X, y + BAR_TOP, lava, LavaGeneratorBlockEntity.TANK_CAPACITY, 0xFFFF7A00);
                  String lavaText = lava + " mB";
                  g.text(this.font, Component.literal(lavaText), x + LAVA_X + BAR_WIDTH / 2 - this.font.width(lavaText) / 2, y + BAR_TOP + BAR_HEIGHT + 4, 0xFF404040, false);

                  // Energy bar
                  int fe = this.menu.getEnergy();
                  bar(g, x + ENERGY_X, y + BAR_TOP, fe, LavaGeneratorBlockEntity.ENERGY_CAPACITY, 0xFFE02828);
                  String feText = fe + " FE";
                  g.text(this.font, Component.literal(feText), x + ENERGY_X + BAR_WIDTH / 2 - this.font.width(feText) / 2, y + BAR_TOP + BAR_HEIGHT + 4, 0xFF404040, false);

                  // Arrow between the two bars
                  g.text(this.font, Component.literal("->"), x + 82, y + BAR_TOP + BAR_HEIGHT / 2 - 4, 0xFF404040, false);

                  // Slots, items and the title go on top
                  super.extractRenderState(g, mouseX, mouseY, partialTick);
              }

              private static void bar(GuiGraphicsExtractor g, int x, int y, int amount, int capacity, int color) {
                  g.fill(x - 1, y - 1, x + BAR_WIDTH + 1, y + BAR_HEIGHT + 1, 0xFF373737);
                  g.fill(x, y, x + BAR_WIDTH, y + BAR_HEIGHT, 0xFF8B8B8B);
                  if (capacity > 0 && amount > 0) {
                      int h = Math.max(1, (int) ((long) BAR_HEIGHT * amount / capacity));
                      g.fill(x, y + BAR_HEIGHT - h, x + BAR_WIDTH, y + BAR_HEIGHT, color);
                  }
              }

              private static void slotBg(GuiGraphicsExtractor g, int x, int y) {
                  g.fill(x, y, x + 18, y + 18, 0xFF373737);
                  g.fill(x + 1, y + 1, x + 17, y + 17, 0xFF8B8B8B);
              }
          }
