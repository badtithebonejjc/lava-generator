          cat > src/main/resources/data/lavagenerator/recipe/lava_generator.json <<'__EOF__'
          {"type":"minecraft:crafting_shaped","category":"redstone","pattern":["III","IBI","RFR"],"key":{"I":"minecraft:iron_ingot","B":"minecraft:lava_bucket","R":"minecraft:redstone","F":"minecraft:furnace"},"result":{"id":"lavagenerator:lava_generator","count":1}}
          __EOF__
          mkdir -p src/main/resources/data/minecraft/tags/block/mineable
          cat > src/main/resources/data/minecraft/tags/block/mineable/pickaxe.json <<'__EOF__'
          {"values":["lavagenerator:lava_generator"]}
          __EOF__
          mkdir -p src/main/resources/data/minecraft/tags/block
          cat > src/main/resources/data/minecraft/tags/block/needs_stone_tool.json <<'__EOF__'
          {"values":["lavagenerator:lava_generator"]}
          __EOF__
          mkdir -p src/main/templates/META-INF
          cat > src/main/templates/META-INF/neoforge.mods.toml <<'__EOF__'
          modLoader = "javafml"
          loaderVersion = "[1,)"
          license = "${mod_license}"

          [[mods]]
          modId = "${mod_id}"
          version = "${mod_version}"
          displayName = "${mod_name}"
          authors = "Badtothebonejjc"
          description = '''
          A machine that burns lava and turns it into FE (Forge Energy).
          Fill it with a lava bucket or pipe lava in, open the GUI to see the tank and energy.
          '''

          [[dependencies.${mod_id}]]
          modId = "neoforge"
          type = "required"
          versionRange = "[${neo_version},)"
          ordering = "NONE"
          side = "BOTH"

          [[dependencies.${mod_id}]]
          modId = "minecraft"
          type = "required"
          versionRange = "${minecraft_version_range}"
          ordering = "NONE"
          side = "BOTH"
          __EOF__
      - name: Build
        run: gradle build
      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: lava-generator-mod
          path: build/libs/*.jar
      - name: Zip project sources
        run: zip -r project-sources.zip src build.gradle gradle.properties settings.gradle
      - name: Upload project sources
        uses: actions/upload-artifact@v4
        with:
          name: project-sources
          path: project-sources.zip
